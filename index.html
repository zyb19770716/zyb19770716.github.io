<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: fadeUp .6s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px);} to {opacity:1; transform:none;} }
  .avatar {
    width: 88px; height: 88px; margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: .5px; }
  .tagline { font-size: 14px; color: #94a3b8; margin-bottom: 28px; line-height: 1.6; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a {
    display: block; padding: 13px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: #e2e8f0; text-decoration: none;
    font-size: 14px; transition: all .2s ease;
  }
  .links a:hover {
    background: rgba(99,102,241,0.35);
    border-color: rgba(129,140,248,0.6);
    transform: translateY(-2px);
  }
  footer { margin-top: 28px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">我</div>
    <h1>我的主页</h1>
    <p class="tagline">这是一句简介，可以在 index.html 里随便改。<br>欢迎来到我的个人主页。</p>
    <div class="links">
      <a href="https://github.com" target="_blank">🐙 GitHub</a>
      <a href="mailto:你的邮箱@example.com">📧 邮箱</a>
      <a href="#contact">📄 关于我</a>
    </div>
    <footer>© 2026 我的主页 · 用 GitHub Pages 免费托管</footer>
  </div>
</body>
</html>
